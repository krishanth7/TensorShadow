openapi: 3.0.0
info:
  title: TensorShadow API
  description: High-performance intelligence framework API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/predict:
    post:
      summary: Model inference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: number
      responses:
        '200':
          description: OK

