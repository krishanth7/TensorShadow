name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o bin/ ./go_backend ./go_backend/cmd/...
      - name: End-to-end demo against the built server
        run: |
          ./bin/go_backend -log-level warn &
          for i in $(seq 30); do curl -fsS localhost:8080/api/v1/health && break; sleep 0.2; done
          ./bin/tsdemo -out /tmp/demo
          python3 clients/python/tensorshadow_client.py

  python:
    name: Repository smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python smoke_test.py
